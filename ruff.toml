# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

extend-exclude = [
    "_legacy_v1",
    ".agent",
    "docs",
    "src",
]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "PLR0913", # Too many arguments - often necessary for API/DB functions
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# Standard test-specific ignores:
# S101: Use of assert detected (standard for pytest)
# PLR2004: Magic value used in comparison (common in tests)
# ANN: Missing type annotations (not strictly enforced in tests)
# SLF001: Private member access (tests need to access private members)
# ARG: Unused arguments (fixes fixture usage false positives)
# D: Docstrings (not required for all tests)
# PT018: Assertion should be broken down (preference)
# E501: Line too long (often unavoidable in tests)
"tests/**/*" = [
    "S101",
    "PLR2004",
    "ANN",
    "SLF001",
    "ARG",
    "D",
    "PT018",
    "E501",
    "PLR", # Tests can be complex
    "TRY", # Exception styles less critical in tests
    "EM",  # Exception messages less critical in tests
    "S608", # SQL injection risks in tests safe
    "N802", # Mocking protobuf methods often requires CamelCase
]

# Scripts are auxiliary and often have higher complexity/printing
"scripts/**/*" = [
    "D",
    "PLR",
    "I001",
]

# Allow many arguments in integration components (dependency injection, etc)
"custom_components/**/*" = [
    "PLR0913",
]
