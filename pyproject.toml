[project]
name = "ha-pp-reader"
version = "2.0.0"
description = "Home Assistant Integration for Portfolio Performance"
authors = [{name = "Antigravity", email = "agent@deepmind.com"}]
requires-python = ">=3.11"
dependencies = [
    "homeassistant",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yahooquery>=2.4.1",
    "lxml>=5.2.1",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=custom_components/pp_reader/lib"
testpaths = [
    "tests",
]
pythonpath = ["."]
